name: Deploy to S3

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'images/**'
      - 'js/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Write js/config.js from secret
        run: echo "${{ secrets.JS_CONFIG }}" > js/config.js

      - name: Sync to S3
        run: |
          aws s3 sync . s3://manandhismower.ca \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude "lambda/*" \
            --exclude "deploy.sh" \
            --exclude "CLAUDE.md" \
            --exclude "README.md" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E26TIIMP64NNQ3 \
            --paths "/*" \
            --query "Invalidation.{Id:Id,Status:Status}" \
            --output table
